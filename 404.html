<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost · Nikhil Mourya</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0d0f">
  <link rel="icon" href="/assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=55">
  <script>
    (function () { var s; try { s = localStorage.getItem('season'); } catch (e) {}
      document.documentElement.dataset.season = s || ['winter','winter','spring','spring','spring','summer','summer','summer','autumn','autumn','autumn','winter'][new Date().getMonth()]; })();
  </script>
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; background: #0b0c14; }
    .lost { position: fixed; inset: 0; }
    .lost canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .lost__copy { position: absolute; left: 50%; top: 13vh; width: min(600px, calc(100vw - 48px)); transform: translateX(-50%); text-align: center; text-shadow: 0 2px 20px rgba(6, 7, 16, 0.8); }
    .lost__links { justify-content: center; }
    .lost__copy .seal { width: 38px; height: 38px; font-size: 19px; transform: rotate(-4deg); }
    .lost__copy h1 { margin-top: 26px; font: 600 clamp(34px, 5vw, 58px)/1.1 var(--serif); }
    .lost__copy p { margin-top: 16px; font: 400 18px/1.5 var(--serif); color: rgba(var(--fg-rgb), 0.78); }
    .lost__links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <main class="lost">
    <canvas id="scene-end" aria-hidden="true"></canvas>
    <div class="lost__copy">
      <span class="seal" lang="ja" aria-hidden="true">迷</span>
      <h1>This path doesn't exist.</h1>
      <p>Even the village has dead ends. The lanterns are lit on the way back.</p>
      <div class="lost__links">
        <a class="btn btn--primary" href="/">Back to the start <span aria-hidden="true">→</span></a>
        <a class="btn btn--ghost" href="/#writing">Read something instead</a>
      </div>
    </div>
  </main>
  <script src="/assets/js/season.js"></script>
  <script src="/assets/js/scene.js"></script>
</body>
</html>
